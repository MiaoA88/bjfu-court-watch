# 北林羽毛球场捡漏监控配置
# 改这个文件即可，不需要动代码。

venue:
  # 预约页 https://ehall.bjfu.edu.cn/v2/reserve/hallView?id=54 里的 id
  hall_id: 54

  # 余量接口。probe 跑完后按输出的"建议写入"改这两行。
  margin_endpoint: /site/reservation/resource-info-margin
  margin_method: GET

  # 只关注名字里含这些词的场地（留空 [] 表示全部）
  resource_name_include: []
  # 排除（例如排除"备用场"）
  resource_name_exclude: []

  # 接口参数名不是 hallId/date 时，在这里改名
  param_names: {}
  #   hall: hallId
  #   date: date
  # 额外固定参数
  extra_params: {}

targets:
  # 相对今天往后 N 天：0=今天，1=明天，2=后天
  days_ahead: [1, 2, 3]
  # 绝对日期，优先级与 days_ahead 取并集
  dates: []
  # 想盯的时段（北京时间），接口时段粒度更细时按"有交集"判断
  time_windows:
    - "18:00-19:00"
    - "19:00-20:00"

matching:
  # 至少连续几段才算命中；1 = 任一时段有空就推
  min_consecutive_slots: 1

# 查询窗口（北京时间，左闭右开）。
# 系统 20:00-次日 09:00 关闭，此时段不查询、不推送。
active_hours: ["09:00", "20:00"]

notify:
  provider: wxpusher_spt
  # 同一空场（日期+时段+场地）整个生命周期内最多推几次
  max_alerts_per_slot: 1
  # 推送里"打开预约页"的链接
  detail_url: "https://ehall.bjfu.edu.cn/v2/reserve/hallView?id=54"

http:
  timeout_seconds: 15
  retries: 2

state:
  path: .state/notified.json

# 响应字段映射。probe 后若 slots=0，改这里而不是改代码。
fields:
  start: [startTime, beginTime, start, startStr, timeStart, begin, startDate, fromTime]
  end: [endTime, finish, end, endStr, timeEnd, toTime]
  remaining: [surplus, remain, remaining, leftNum, left, available, stock, canReserve, isFree]
  capacity: [capacity, total, totalNum, maxNum]
  resource_name: [resourceName, name, hallName, resourceTitle, title, placeName]
  resource_id: [resourceId, resourceCode, id, code]
  date: [date, reserveDate, day, useDate, bizDate, timeDate]
