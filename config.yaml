# 北林羽毛球场捡漏监控配置
# 改这个文件即可，不需要动代码。

venue:
  # 预约页 https://ehall.bjfu.edu.cn/v2/reserve/hallView?id=54 的 id
  # 54 = 多功能厅运动场地预约（含 羽毛球综合场馆 156 / 乒乓球 157）
  hall_id: 54
  page_size: 20

  # 可用性判定。实测状态码：
  #   1=可预约  3=已约满  4=不可预约  5=未开放  0=已过期
  # 注意 status=5 时 margin 也返回 1，只看余量会把未来整月误报成空场。
  available_status: 1

  # 只看这些资源（156=羽毛球综合场馆，157=乒乓球综合场馆）。
  # 54 号场馆下挂了两个运动项目，不限定会把乒乓球也算进来。
  resource_ids: [156]

  # 只关注名字里含这些词的场地（留空 [] 表示全部）
  # 例：["1号", "2号"] 只看 1、2 号塑胶场地
  resource_name_include: []
  resource_name_exclude: []

# ── 每周固定盯场表 ────────────────────────────────────────────────
# weekday: 1=周一 … 7=周日。日期与时段绑在一起，一行管一个"周几 + 时段"，
# 所以完全可以周一盯 20:00、周六盯 14:00。
#
# 运行规则：
#   * 系统每周一早上才放"本周"的场，所以只查本周（周一起算）还没过去的周几；
#     周一运行会一次把本周所有配置的周几都查了，周中只查剩下的，过了就跳过。
#   * 表长期有效、按周循环，不会因为本周过去而被清空，下周一自动重新生效。
#
# 时段写法：
#   一个窗口可以跨任意多个场次，"14:00-22:00" 会命中其中每一个 1 小时场次；
#   想跳开中间某段就写多个窗口：["14:00-16:00", "19:00-21:00"]；
#   只有一个窗口时也可以不写列表：time_windows: "14:00-22:00"。
schedule:
  - weekday: 1                     # 周一
    time_windows: ["19:00-22:00"]
  - weekday: 2                     # 周二
    time_windows: ["19:00-22:00"]
  - weekday: 3                     # 周三
    time_windows: ["19:00-22:00"]
  - weekday: 4                     # 周四
    time_windows: ["19:00-22:00"]
  - weekday: 5                     # 周五
    time_windows: ["19:00-22:00"]
  - weekday: 6                     # 周六
    time_windows: ["14:00-22:00"]
  - weekday: 7                     # 周日
    time_windows: ["14:00-22:00"]

matching:
  # 至少连续几段才算命中；1 = 任一时段有空就推
  min_consecutive_slots: 1

# 扫描窗口（北京时间，左闭右开）。
# 这是"我要盯的时间"，不是系统开关时间：系统 09:00-23:00 开放预约。
active_hours: ["14:00", "22:00"]

notify:
  provider: wxpusher_spt
  # 同一空场（日期+时段+场地）整个生命周期内最多推几次
  max_alerts_per_slot: 1
  detail_url: "https://ehall.bjfu.edu.cn/v2/reserve/hallView?id=54"
  # 盯场表有变化时推一条"当前最新时段"，方便确认改动生效
  announce_schedule_changes: true

http:
  timeout_seconds: 15
  retries: 2

state:
  path: .state/notified.json
