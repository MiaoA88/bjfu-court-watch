name: dispatch-probe

# Temporary diagnostic: pushes a WxPusher message on every scheduled dispatch,
# so the arrival pattern on your phone shows the real cron reliability
# (delays, gaps, dropped runs) without reading Actions logs.
# Delete this file once the question is answered.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Push heartbeat
        env:
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
        run: |
          NOW=$(TZ=Asia/Shanghai date '+%m-%d %H:%M:%S')
          echo "fired at $NOW Beijing (event: ${{ github.event_name }})"
          curl -s -X POST https://wxpusher.zjiecode.com/api/send/message/simple-push \
            -H 'Content-Type: application/json' \
            -d "{\"spt\":\"${WXPUSHER_SPT}\",\"content\":\"⏱ 调度探针\\n\\n触发时间：$NOW（北京）\\n事件：${{ github.event_name }}\\n\\n如果两次间隔明显大于 5 分钟，或长时间没有，说明 GitHub 在丢任务。\",\"summary\":\"⏱ 探针 $NOW\",\"contentType\":3}"
          echo "sent"
