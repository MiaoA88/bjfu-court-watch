name: config-check

# Validate config and announce it from the default branch.
# External scheduling is configured separately in cron-job.org.

on:
  push:
    paths:
      - "config.yaml"
      - "src/**"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate config
        run: python -m src.cli check

      - name: Announce effective schedule
        if: github.ref_name == github.event.repository.default_branch
        env:
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
        run: python -m src.cli announce
