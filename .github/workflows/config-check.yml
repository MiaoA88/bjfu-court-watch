name: config-check

# Validate config; watch is the only automatic schedule announcement entry.
# External scheduling is configured separately in cron-job.org.

on:
  push:
    paths:
      - "config.yaml"
      - "src/**"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate config
        run: python -m src.cli check
