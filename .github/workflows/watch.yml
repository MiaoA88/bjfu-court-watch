name: court-watch

on:
  schedule:
    # Keep in sync with config.yaml: active_hours 12:00-20:00 (Beijing) and the
    # schedule weekdays. UTC 04:00-11:55 == Beijing 12:00-19:55.
    # tests/test_workflow_consistency.py enforces this match.
    - cron: "*/5 4-11 * * 1,6"
  workflow_dispatch:

concurrency:
  group: court-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Dedup state survives across runs: a unique key per run keeps the cache
      # writable, and restore-keys picks the most recent entry.
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: .state
          key: court-state-${{ github.run_id }}
          restore-keys: |
            court-state-

      - name: Watch
        env:
          EHALL_COOKIE: ${{ secrets.EHALL_COOKIE }}
          EHALL_UA: ${{ secrets.EHALL_UA }}
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
        run: python -m src.cli watch
