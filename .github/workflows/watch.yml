name: court-watch

on:
  # Triggered externally by cron-job.org via the workflow_dispatch REST API.
  # See README.md for the request and timezone configuration.
  workflow_dispatch:

concurrency:
  group: court-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Restore the newest state. A distinct key also supports manual reruns.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: court-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            court-state-

      - name: Watch
        env:
          EHALL_COOKIE: ${{ secrets.EHALL_COOKIE }}
          EHALL_UA: ${{ secrets.EHALL_UA }}
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
        run: python -m src.cli watch

      # Persist pending notifications even when sending fails.
      - name: Save state
        if: always() && hashFiles('.state/notified.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .state
          key: court-state-${{ github.run_id }}-${{ github.run_attempt }}
