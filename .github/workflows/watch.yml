name: court-watch

on:
  schedule:
    # Every day. Step and hour range must match config.yaml active_hours
    # 09:00-22:00 (Beijing) + scan_interval_minutes 15:
    # UTC 01:00-13:55 == Beijing 09:00-21:55.
    # GitHub bills each job rounded up to 1 minute, so the real budget is
    # run COUNT (<= 2000/month), not duration. */15 over 13h = 52 runs/day.
    # tests/test_workflow_consistency.py enforces this match.
    - cron: "*/15 1-13 * * *"
  workflow_dispatch:

concurrency:
  group: court-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Dedup state survives across runs: a unique key per run keeps the cache
      # writable, and restore-keys picks the most recent entry.
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: .state
          key: court-state-${{ github.run_id }}
          restore-keys: |
            court-state-

      - name: Watch
        env:
          EHALL_COOKIE: ${{ secrets.EHALL_COOKIE }}
          EHALL_UA: ${{ secrets.EHALL_UA }}
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
        run: python -m src.cli watch
