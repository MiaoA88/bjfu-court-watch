name: court-watch

on:
  schedule:
    # Every day. Hour range must match config.yaml active_hours 14:00-22:00
    # (Beijing): UTC 06:00-13:55 == Beijing 14:00-21:55.
    # Which dates to query is decided in code (plan_targets), not by cron.
    # tests/test_workflow_consistency.py enforces this match.
    - cron: "*/5 6-13 * * *"
  workflow_dispatch:

concurrency:
  group: court-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Dedup state survives across runs: a unique key per run keeps the cache
      # writable, and restore-keys picks the most recent entry.
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: .state
          key: court-state-${{ github.run_id }}
          restore-keys: |
            court-state-

      - name: Watch
        env:
          EHALL_COOKIE: ${{ secrets.EHALL_COOKIE }}
          EHALL_UA: ${{ secrets.EHALL_UA }}
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
        run: python -m src.cli watch
