name: court-watch

on:
  # Triggered externally by cron-job.org via the workflow_dispatch REST API.
  # GitHub's own schedule was measured at ~3 fires per 3 days for a */5 cron
  # (delays of 6+ hours), so it is no longer used.
  # See local-deploy/cronjob-config.py for the exact request to configure.
  workflow_dispatch:

concurrency:
  group: court-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Dedup state survives across runs: a unique key per run keeps the cache
      # writable, and restore-keys picks the most recent entry.
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: .state
          key: court-state-${{ github.run_id }}
          restore-keys: |
            court-state-

      - name: Watch
        env:
          EHALL_COOKIE: ${{ secrets.EHALL_COOKIE }}
          EHALL_UA: ${{ secrets.EHALL_UA }}
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
        run: python -m src.cli watch
